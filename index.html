<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse Temperature Cycles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="underline">Visualizing Daily Temperature Cycles of Mice Across Gender</h1>
  
  <!-- Container holding the chart and the sidebar (legend + reset button) side by side -->
  <div class="chart-legend-container">
    <!-- Chart container -->
    <div id="chart-container"></div>
    <!-- Sidebar container -->
    <div class="sidebar">
      <!-- Legend with checkboxes -->
      <div class="legend">
        <label class="legend-item">
          <input type="checkbox" id="maleCheckbox" checked>
          <span class="legend-color" style="background-color: #3690c0;"></span>
          Males
        </label>
        <label class="legend-item">
          <input type="checkbox" id="nonEstrusCheckbox" checked>
          <span class="legend-color" style="background-color: #ffa500;"></span>
          Females (Non-Estrus)
        </label>
        <label class="legend-item">
          <input type="checkbox" id="estrusCheckbox" checked>
          <span class="legend-color" style="background-color: #ff0000;"></span>
          Females (Estrus)
        </label>
      </div>
      <!-- Reset button -->
      <div class="reset-container">
        <button id="resetBrush">Reset Scope</button>
      </div>
    </div>
  </div>
  
  <div id="tooltip"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
